name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/echo-node

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.120

      - run: pnpm install --frozen-lockfile

      - name: Build WASM (echo-node)
        run: pnpm build:wasm

      - name: Type check
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/echo-node

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - run: pnpm install --frozen-lockfile

      - name: Cargo test (src-tauri)
        working-directory: src-tauri
        run: cargo test

      - name: Cargo test (echo-node)
        working-directory: crates/echo-node
        run: cargo test --features native

      - name: Build Tauri app
        run: pnpm tauri build --no-bundle
